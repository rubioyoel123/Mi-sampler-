
name: sampler_perreo
description: "Aplicacion Sampler Perreo para Windows"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0
  flutter_soloud: ^5.2.0
  file_picker: ^13.1.0
  flutter_midi_command: ^1.4.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sk5/
    - assets/champeta/
    - assets/dembow/
