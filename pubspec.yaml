
name: midi_sampler
description: Sampler Perreo para Windows
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  file_picker: ^13.1.0
  flutter_midi_command: 1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  flutter_midi_command_windows: 1.3.0
  flutter_midi_command_platform_interface: 1.3.0

flutter:
  uses-material-design: true
