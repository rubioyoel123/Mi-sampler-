
name: Compilar Sampler Perreo

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar Flutter
        run: flutter doctor -v

      - name: Activar Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Verificar proyecto Flutter
        shell: pwsh
        run: |
          if (!(Test-Path "pubspec.yaml")) {
            Write-Error "No se encuentra pubspec.yaml en la raiz del proyecto."
            exit 1
          }

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar Sampler Perreo
        run: flutter build windows --release

      - name: Guardar compilacion
        uses: actions/upload-artifact@v4
        with:
          name: Sampler-Perreo-Windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
