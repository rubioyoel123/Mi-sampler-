name: Compilar DANPAD

on:
  push:
    branches:
      - main
      - master
      - sampler-perreo-windows
      - danpad
  workflow_dispatch:

jobs:
  build-windows:
    name: Compilar DANPAD para Windows
    runs-on: windows-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activar soporte para Windows
        run: flutter config --enable-windows-desktop

      - name: Crear archivos de Windows
        run: flutter create --platforms=windows .

      - name: Preparar samples CC0 y sinteticos originales
        shell: pwsh
        run: ./tool/prepare_assets.ps1

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar DANPAD
        run: flutter build windows --release

      - name: Guardar aplicacion compilada
        uses: actions/upload-artifact@v4
        with:
          name: DANPAD-Windows
          path: build/windows/x64/runner/Release/

  build-android:
    name: Compilar DANPAD para Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear archivos de Android
        run: flutter create --platforms=android .

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: DANPAD-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
