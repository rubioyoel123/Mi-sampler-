Name: Compilar Mi Sampler para Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar MSVC para C++
        uses: ilammy/msvc-dev-cmd@v1

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Comprobar archivos del proyecto
        shell: pwsh
        run: |
          if (!(Test-Path "pubspec.yaml")) {
            Write-Error "No se encontró pubspec.yaml en la raíz del repositorio."
            exit 1
          }

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze
        continue-on-error: true

      - name: Compilar para Windows
        run: flutter build windows --release

      - name: Subir aplicación compilada
        uses: actions/upload-artifact@v4
        with:
          name: mi-sampler-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
