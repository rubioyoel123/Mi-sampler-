name: Compilar Sampler Perreo para Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verificar dependencias de Flutter
        run: flutter doctor -v

      - name: Habilitar soporte para Windows
        run: flutter config --enable-windows-desktop

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar ejecutable para Windows
        run: flutter build windows --release

      - name: Subir artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: Sampler-Perreo-Windows
          path: build/windows/x64/runner/Release/

  
