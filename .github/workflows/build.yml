
name: Compilar Sampler Perreo

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activar soporte para Windows
        run: flutter config --enable-windows-desktop

      - name: Crear archivos de Windows
        run: flutter create --platforms=windows .

      - name: Descargar samples autenticos Casio SK-5 (CC0)
        shell: bash
        run: |
          python3 - <<'PY'
          import io, os, re, urllib.request, zipfile
          from pathlib import Path
          url = "https://storage.googleapis.com/www-frequency303-com-data-prod/SK-5-Drums.zip"
          print("Descargando paquete SK-5 CC0...")
          data = urllib.request.urlopen(url, timeout=60).read()
          archive = zipfile.ZipFile(io.BytesIO(data))
          files = [n for n in archive.namelist() if not n.endswith("/") and n.lower().endswith((".wav", ".wave"))]
          print("WAV encontrados:", [Path(n).name for n in files])
          targets = {
            "kick.wav": ["kick"],
            "snare.wav": ["snare"],
            "hihat.wav": ["hihat", "hi hat", "hi-hat", "hat"],
            "conga_high.wav": ["conga high", "conga_high", "high conga", "bongo high", "high bongo", "hibongo", "hi bongo"],
            "conga_low.wav": ["conga low", "conga_low", "low conga", "bongo low", "low bongo", "lowbongo", "low bongo"],
            "laser.wav": ["laser", "lazer"],
            "dog.wav": ["dog", "bark"],
            "lion.wav": ["lion", "roar"],
          }
          def norm(s):
            return re.sub(r"[^a-z0-9]+", " ", Path(s).stem.lower()).strip()
          chosen = {}
          for out, aliases in targets.items():
            matches = []
            for name in files:
              stem = norm(name)
              if any(alias in stem for alias in aliases):
                matches.append(name)
            if matches:
              chosen[out] = matches[0]
          missing = sorted(set(targets) - set(chosen))
          if missing:
            raise SystemExit("Faltan samples SK-5 requeridos: " + ", ".join(missing))
          outdir = Path("assets/sk5")
          outdir.mkdir(parents=True, exist_ok=True)
          for out, source in chosen.items():
            (outdir / out).write_bytes(archive.read(source))
            print(source, "->", out)
          PY

      - name: Descargar kits Champeta y Dembow (royalty-free)
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          from pathlib import Path
          base = "https://crate.hiphop/packs/dembow-latino/samples/"
          samples = [
            "808-c.wav", "808-f.wav", "808-g.wav", "808-long.wav",
            "kick-beater.wav", "kick-tight-beater.wav", "snare.wav", "clap.wav",
            "clave.wav", "clave-low.wav", "timbale-low-twin.wav", "timbale-high-twin.wav",
            "conga-low.wav", "conga-high.wav", "cowbell.wav", "shaker.wav",
          ]
          # Percusión y bajos libres de regalías; cada banco usa su propio orden.
          for folder in ("champeta", "dembow"):
            out = Path("assets") / folder
            out.mkdir(parents=True, exist_ok=True)
            for name in samples:
              url = base + name
              request = urllib.request.Request(url, headers={"User-Agent": "SamplerPerreo/1.0"})
              with urllib.request.urlopen(request, timeout=45) as response:
                data = response.read()
              if len(data) < 100:
                raise SystemExit("Sample vacío o inválido: " + url)
              (out / name).write_bytes(data)
              print(folder, name, len(data), "bytes")
          # El banco Champeta combina percusión latina con efectos Casio SK-5.
          sk5 = Path("assets/sk5")
          champeta_dir = Path("assets/champeta")
          for name in ("kick.wav", "snare.wav", "hihat.wav", "conga_low.wav", "conga_high.wav", "laser.wav", "dog.wav", "lion.wav"):
            source = sk5 / name
            if not source.exists():
              raise SystemExit("Falta sample Casio SK-5 para Champeta: " + name)
            (champeta_dir / name).write_bytes(source.read_bytes())
            print("champeta FX", name, "copiado desde Casio SK-5")
          PY


      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar Sampler Perreo
        run: flutter build windows --release

      - name: Guardar aplicacion compilada
        uses: actions/upload-artifact@v4
        with:
          name: Sampler-Perreo-Windows
          path: build/windows/x64/runner/Release/
