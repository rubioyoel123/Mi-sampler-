
name: Compilar Sampler Perreo para Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Habilitar Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Generar archivos de Windows
        run: flutter create --platforms=windows .

      - name: Limpiar proyecto
        run: flutter clean

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze

      - name: Compilar Sampler Perreo
        run: flutter build windows --release

      - name: Guardar aplicación compilada
        uses: actions/upload-artifact@v4
        with:
          name: Sampler-Perreo-Windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
