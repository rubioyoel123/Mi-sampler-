
name: Compilar Sampler Perreo PRO para Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    name: Compilar para Windows
    runs-on: windows-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verificar Flutter
        run: flutter --version

      - name: Habilitar Windows
        run: flutter config --enable-windows-desktop

      - name: Descargar dependencias
        run: flutter pub get

      - name: Revisar codigo
        run: flutter analyze
        continue-on-error: true

      - name: Compilar aplicacion
        run: flutter build windows --release

      - name: Publicar programa compilado
        uses: actions/upload-artifact@v4
        with:
          name: Sampler-Perreo-PRO-Windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
