Name: Compilar Mi Sampler para Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Habilitar Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Verificar Flutter
        run: flutter doctor -v

      - name: Limpiar proyecto
        run: flutter clean

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar código
        run: flutter analyze
        continue-on-error: true

      - name: Compilar para Windows
        run: flutter build windows --release

      - name: Guardar aplicación compilada
        uses: actions/upload-artifact@v4
        with:
          name: mi-sampler-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
