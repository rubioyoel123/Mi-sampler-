
name: Compilar para Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar proyecto
        shell: pwsh
        run: |
          if (!(Test-Path "pubspec.yaml")) {
            throw "Falta pubspec.yaml"
          }
          if (!(Test-Path "lib/main.dart")) {
            throw "Falta lib/main.dart"
          }

      - name: Habilitar Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Preparar plataforma Windows
        shell: pwsh
        run: |
          if (!(Test-Path "windows/CMakeLists.txt")) {
            flutter create --platforms=windows .
          }

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar aplicación
        run: flutter build windows --release

      - name: Subir aplicación compilada
        uses: actions/upload-artifact@v4
        with:
          name: Sampler-Windows-Release
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          
