
name: Compilar Sampler Perreo PRO para Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicación
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verificar Flutter
        run: flutter doctor -v

      - name: Habilitar Windows
        run: flutter config --enable-windows-desktop

      - name: Crear archivos de Windows si faltan
        shell: pwsh
        run: |
          if (!(Test-Path "windows/CMakeLists.txt")) {
            flutter create --platforms=windows --project-name=sampler_perreo_pro .
          }

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar aplicación
        run: flutter build windows --release

      - name: Guardar aplicación compilada
        uses: actions/upload-artifact@v4
        with:
          name: Sampler-Perreo-PRO-Windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

