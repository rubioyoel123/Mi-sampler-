
name: Compilar Sampler Perreo para Windows

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicacion Windows
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activar soporte Windows
        run: flutter config --enable-windows-desktop

      - name: Verificar Flutter
        run: flutter --version

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar codigo Dart
        run: flutter analyze

      - name: Compilar Sampler Perreo
        run: flutter build windows --release

      - name: Guardar aplicacion compilada
        uses: actions/upload-artifact@v4
        with:
          name: Sampler-Perreo-Windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 7
