name: Compilar para Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar Flutter
        run: flutter doctor -v

      - name: Habilitar Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Comprobar estructura del proyecto
        shell: pwsh
        run: |
          if (!(Test-Path "pubspec.yaml")) {
            throw "No existe pubspec.yaml en la raíz del repositorio."
          }

          if (!(Test-Path "lib/main.dart")) {
            throw "No existe lib/main.dart."
          }

          if (!(Test-Path "windows/CMakeLists.txt")) {
            flutter create --platforms=windows .
          }

      - name: Obtener dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze
        continue-on-error: true

      - name: Compilar para Windows
        run: flutter build windows --release

      - name: Subir ejecutable y dependencias
        uses: actions/upload-artifact@v4
        with:
          name: Sampler-Windows-Release
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          
