name: Compilar para Windows

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Generar pubspec.yaml si falta
      run: |
        if (-not (Test-Path "pubspec.yaml")) {
          @"
        name: mi_sampler
        description: "A new Flutter project."
        publish_to: 'none'
        version: 1.0.0+1
        environment:
          sdk: '>=3.0.0 <4.0.0'
        dependencies:
          flutter:
            sdk: flutter
        flutter:
          uses-material-design: true
        "@ | Out-File -FilePath pubspec.yaml -Encoding utf8
        }

    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Habilitar ejecutable Windows
      run: flutter config --enable-windows-desktop

    - name: Compilar ejecutable .exe
      run: flutter build windows --release

    - name: Subir instalador como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: Sampler-Windows-EXE
        path: build/windows/runner/Release/
        
