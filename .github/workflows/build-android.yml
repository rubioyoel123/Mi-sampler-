name: Compilar Sampler Perreo para Android

on:
  push:
    branches:
      - android-version
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear archivos de Android
        run: flutter create --platforms=android .

      - name: Poner la aplicación en horizontal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          marker = 'android:name=".MainActivity"'
          if marker not in content:
              raise SystemExit("No se encontró MainActivity en AndroidManifest.xml")
          content = content.replace(marker, marker + '\\n            android:screenOrientation="landscape"', 1)
          manifest.write_text(content)
          PY

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK de Android
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Sampler-Perreo-Android
          path: build/app/outputs/flutter-apk/app-release.apk
