name: Compilar Sampler Perreo para Android

on:
  push:
    branches:
      - android-version
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear archivos de Android
        run: flutter create --platforms=android .

      - name: Poner la aplicación en horizontal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          marker = 'android:name=".MainActivity"'
          if marker not in content:
              raise SystemExit("No se encontró MainActivity en AndroidManifest.xml")
          content = content.replace(marker, marker + '\n            android:screenOrientation="landscape"', 1)
          manifest.write_text(content)
          PY

      - name: Descargar samples autenticos Casio SK-5 (CC0)
        run: |
          python3 - <<'PY'
          import io, os, re, urllib.request, zipfile
          from pathlib import Path
          url = "https://storage.googleapis.com/www-frequency303-com-data-prod/SK-5-Drums.zip"
          print("Descargando paquete SK-5 CC0...")
          data = urllib.request.urlopen(url, timeout=60).read()
          archive = zipfile.ZipFile(io.BytesIO(data))
          files = [n for n in archive.namelist() if not n.endswith("/") and n.lower().endswith((".wav", ".wave"))]
          print("WAV encontrados:", [Path(n).name for n in files])
          targets = {
            "kick.wav": ["kick"],
            "snare.wav": ["snare"],
            "hihat.wav": ["hihat", "hi hat", "hi-hat", "hat"],
            "conga_high.wav": ["conga high", "conga_high", "high conga", "bongo high", "high bongo", "hibongo", "hi bongo"],
            "conga_low.wav": ["conga low", "conga_low", "low conga", "bongo low", "low bongo", "lowbongo", "low bongo"],
            "laser.wav": ["laser", "lazer"],
            "dog.wav": ["dog", "bark"],
            "lion.wav": ["lion", "roar"],
          }
          def norm(s):
            return re.sub(r"[^a-z0-9]+", " ", Path(s).stem.lower()).strip()
          chosen = {}
          for out, aliases in targets.items():
            matches = []
            for name in files:
              stem = norm(name)
              if any(alias in stem for alias in aliases):
                matches.append(name)
            if matches:
              chosen[out] = matches[0]
          missing = sorted(set(targets) - set(chosen))
          if missing:
            raise SystemExit("Faltan samples SK-5 requeridos: " + ", ".join(missing))
          outdir = Path("assets/sk5")
          outdir.mkdir(parents=True, exist_ok=True)
          for out, source in chosen.items():
            (outdir / out).write_bytes(archive.read(source))
            print(source, "->", out)
          PY

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK de Android
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Sampler-Perreo-Android
          path: build/app/outputs/flutter-apk/app-release.apk
